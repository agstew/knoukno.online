version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: knoukno-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: knoukno

  backend:
    build: ./backend
    container_name: knoukno-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/knoukno
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: knoukno-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
